name: Update profile art

# Refreshes the contribution graph + stats card SVGs daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py kaushalboii contrib-heatmap.svg

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

#      - name: Render building blocks card
#        run: python scripts/render_blocks_svg.py

      - name: Render dev system telemetry card
        run: python scripts/render_dev_system_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg dev-system.svg"
          commit_user_name: "kaushalboii"
          commit_user_email: "124547139+kaushalboii@users.noreply.github.com"
          commit_author: "kaushalboii <124547139+kaushalboii@users.noreply.github.com>"
