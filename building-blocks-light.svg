<svg xmlns="http://www.w3.org/2000/svg" width="860" height="530" viewBox="0 0 860 530" style="color-scheme: light;" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f6f8fa"/>
  </linearGradient>
  <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f6f8fa"/>
  </linearGradient>
</defs>
<style>
  :root { color-scheme: light; }
  .card { opacity: 0; animation: in 0.45s ease-out both; }
  .pulse { animation: blink 2s infinite ease-in-out; }
  @keyframes in {
    0% { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .pulse { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<!-- Terminal Window Background -->
<rect class="win-bg" width="860" height="530" rx="12" fill="url(#bg)"/>
<rect class="frame-col" x="0.5" y="0.5" width="859" height="529" rx="12" fill="none" stroke="#d0d7de" stroke-width="1"/>

<!-- Titlebar -->
<line class="frame-col" x1="0" y1="32" x2="860" y2="32" stroke="#d0d7de"/>
<circle cx="20" cy="16" r="5" fill="#ff5f56"/>
<circle cx="36" cy="16" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="16" r="5" fill="#27c93f"/>

<!-- Terminal Command Title -->
<text class="txt-muted" x="430.0" y="21" fill="#57606a" font-size="12" text-anchor="middle">kaushal@dev-station: ~$ ./building-blocks.sh --status=active</text>

<!-- Top Right System Status Pulse -->
<g transform="translate(725, 16)">
  <circle cx="0" cy="0" r="4" fill="#1a7f37" class="dot-fill pulse"/>
  <circle cx="0" cy="0" r="2" fill="#1a7f37" class="dot-fill"/>
  <text class="txt-green" x="10" y="3.5" fill="#1a7f37" font-size="10" font-weight="700" letter-spacing="1">SYSTEM OK</text>
</g>

<!-- Tech Crosshairs / HUD brackets -->
<path class="hud-cyan" d="M 22 46 L 34 46 M 22 46 L 22 58" stroke="#0969da" stroke-width="1.5" fill="none" opacity="0.6"/>
<path class="hud-cyan" d="M 838 46 L 826 46 M 838 46 L 838 58" stroke="#0969da" stroke-width="1.5" fill="none" opacity="0.6"/>
<path class="hud-cyan" d="M 22 508 L 34 508 M 22 508 L 22 496" stroke="#0969da" stroke-width="1.5" fill="none" opacity="0.6"/>
<path class="hud-cyan" d="M 838 508 L 826 508 M 838 508 L 838 496" stroke="#0969da" stroke-width="1.5" fill="none" opacity="0.6"/>


<!-- Card 01 -->
<g class="card" style="animation-delay: 0.08s">
  <rect class="card-grad-fill" x="22.0" y="50.0" width="400.0" height="220.0" rx="8" fill="url(#card-grad)" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Index Number -->
  <text class="bracket-cyan" x="40.0" y="82.0" fill="#0969da" font-size="12" font-weight="700">[01]</text>
  
  <!-- Card Title -->
  <text class="txt-ink" x="68.0" y="82.0" fill="#1f2328" font-size="13" font-weight="700" letter-spacing="1">MOBILE ARCHITECTURE</text>
  
  <!-- Stack / Tech Badge -->
  <rect class="badge-box-0" x="252.0" y="68.0" width="154" height="20" rx="4" fill="#0969da1a"/>
  <text class="badge-txt-0" x="329.0" y="82.0" fill="#0969da" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">SWIFTUI · FLUTTER · KOTLIN</text>

  <!-- Divider Line -->
  <line class="frame-col" x1="38.0" y1="96.0" x2="406.0" y2="96.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <text class="txt-muted" x="40.0" y="124.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">SwiftUI Native &amp; Jetpack Compose</tspan></text>
  <text class="txt-muted" x="40.0" y="149.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">Kinetic Motion &amp; Micro-Interactions</tspan></text>
  <text class="txt-muted" x="40.0" y="174.0" fill="#57606a" font-size="11">└── <tspan class="txt-ink" fill="#1f2328">Offline-First State &amp; Sync Engines</tspan></text>

  <!-- Card Footer -->
  <line class="frame-col" x1="38.0" y1="236.0" x2="406.0" y2="236.0" stroke="#d0d7de" stroke-width="1"/>
  <text class="txt-muted" x="40.0" y="254.0" fill="#57606a" font-size="9" font-weight="700" letter-spacing="1">METRIC // DEPLOYMENTS:</text>
  <text class="metric-val-0" x="404.0" y="254.0" fill="#0969da" font-size="10" font-weight="700" text-anchor="end">12+ Apps Shipped</text>
</g>


