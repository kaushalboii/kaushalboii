  <!-- Index Number -->
  <text class="bracket-cyan" x="456.0" y="82.0" fill="#0969da" font-size="12" font-weight="700">[02]</text>
  
  <!-- Card Title -->
  <text class="txt-ink" x="484.0" y="82.0" fill="#1f2328" font-size="13" font-weight="700" letter-spacing="1">INTELLIGENT AGENTS</text>
  
  <!-- Stack / Tech Badge -->
  <rect class="badge-box-1" x="668.0" y="68.0" width="154" height="20" rx="4" fill="#1a7f371a"/>
  <text class="badge-txt-1" x="745.0" y="82.0" fill="#1a7f37" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">PYTHON · AGENTS · FASTAPI</text>

  <!-- Divider Line -->
  <line class="frame-col" x1="454.0" y1="96.0" x2="822.0" y2="96.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <text class="txt-muted" x="456.0" y="124.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">Autonomous LLM Workflow Loops</tspan></text>
  <text class="txt-muted" x="456.0" y="149.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">Dynamic SVG &amp; Canvas Generators</tspan></text>
  <text class="txt-muted" x="456.0" y="174.0" fill="#57606a" font-size="11">└── <tspan class="txt-ink" fill="#1f2328">Multimodal Context &amp; Vision Tools</tspan></text>

  <!-- Card Footer -->
  <line class="frame-col" x1="454.0" y1="236.0" x2="822.0" y2="236.0" stroke="#d0d7de" stroke-width="1"/>
  <text class="txt-muted" x="456.0" y="254.0" fill="#57606a" font-size="9" font-weight="700" letter-spacing="1">METRIC // CAPABILITY:</text>
  <text class="metric-val-1" x="820.0" y="254.0" fill="#1a7f37" font-size="10" font-weight="700" text-anchor="end">System Automations</text>
</g>


<!-- Card 03 -->
<g class="card" style="animation-delay: 0.32s">
  <rect class="card-grad-fill" x="22.0" y="286.0" width="400.0" height="220.0" rx="8" fill="url(#card-grad)" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Index Number -->
  <text class="bracket-cyan" x="40.0" y="318.0" fill="#0969da" font-size="12" font-weight="700">[03]</text>
  
  <!-- Card Title -->
  <text class="txt-ink" x="68.0" y="318.0" fill="#1f2328" font-size="13" font-weight="700" letter-spacing="1">FULL-STACK &amp; SYSTEMS</text>
  
  <!-- Stack / Tech Badge -->
  <rect class="badge-box-2" x="252.0" y="304.0" width="154" height="20" rx="4" fill="#0969da1a"/>
  <text class="badge-txt-2" x="329.0" y="318.0" fill="#0969da" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">NODE · DOCKER · POSTGRES</text>

  <!-- Divider Line -->
  <line class="frame-col" x1="38.0" y1="332.0" x2="406.0" y2="332.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <text class="txt-muted" x="40.0" y="360.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">High-Throughput Microservices</tspan></text>
  <text class="txt-muted" x="40.0" y="385.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">PostgreSQL &amp; Redis Event Streams</tspan></text>
  <text class="txt-muted" x="40.0" y="410.0" fill="#57606a" font-size="11">└── <tspan class="txt-ink" fill="#1f2328">Dockerized Container Deployments</tspan></text>

  <!-- Card Footer -->
  <line class="frame-col" x1="38.0" y1="472.0" x2="406.0" y2="472.0" stroke="#d0d7de" stroke-width="1"/>
  <text class="txt-muted" x="40.0" y="490.0" fill="#57606a" font-size="9" font-weight="700" letter-spacing="1">METRIC // ARCHITECTURE:</text>
  <text class="metric-val-2" x="404.0" y="490.0" fill="#0969da" font-size="10" font-weight="700" text-anchor="end">Distributed &amp; Scalable</text>
</g>


<!-- Card 04 -->
<g class="card" style="animation-delay: 0.44s">
  <rect class="card-grad-fill" x="438.0" y="286.0" width="400.0" height="220.0" rx="8" fill="url(#card-grad)" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Index Number -->
  <text class="bracket-cyan" x="456.0" y="318.0" fill="#0969da" font-size="12" font-weight="700">[04]</text>
  
  <!-- Card Title -->
  <text class="txt-ink" x="484.0" y="318.0" fill="#1f2328" font-size="13" font-weight="700" letter-spacing="1">CREATIVE COMMUNITY LAB</text>
  
  <!-- Stack / Tech Badge -->
  <rect class="badge-box-3" x="668.0" y="304.0" width="154" height="20" rx="4" fill="#b453091a"/>
  <text class="badge-txt-3" x="745.0" y="318.0" fill="#b45309" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">OPEN SOURCE · COLLAB</text>

  <!-- Divider Line -->
  <line class="frame-col" x1="454.0" y1="332.0" x2="822.0" y2="332.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <text class="txt-muted" x="456.0" y="360.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">Modular UI Kits &amp; Interactive Specs</tspan></text>
  <text class="txt-muted" x="456.0" y="385.0" fill="#57606a" font-size="11">├── <tspan class="txt-ink" fill="#1f2328">Storytelling through Code &amp; Motion</tspan></text>
  <text class="txt-muted" x="456.0" y="410.0" fill="#57606a" font-size="11">└── <tspan class="txt-ink" fill="#1f2328">Building in Public &amp; Developer Culture</tspan></text>

  <!-- Card Footer -->
  <line class="frame-col" x1="454.0" y1="472.0" x2="822.0" y2="472.0" stroke="#d0d7de" stroke-width="1"/>
  <text class="txt-muted" x="456.0" y="490.0" fill="#57606a" font-size="9" font-weight="700" letter-spacing="1">METRIC // COMMUNITY:</text>
  <text class="metric-val-3" x="820.0" y="490.0" fill="#b45309" font-size="10" font-weight="700" text-anchor="end">Open Collaboration</text>
</g>

</svg>